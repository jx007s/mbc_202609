<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_ffst</title>
</head>
<body>
    <h1>01_ffst</h1>
    <script>
        //console.log("스크립트 실행")

        // 비동기 통신 -> url에 접근하여 url에서 전달하는 데이터 가져오기
        fetch('http://localhost:8080/jspPrj/back_07/01_stud.jsp')
        .then(async rr =>{  // Promise 처리 await  => async
            //console.log("정상실행", rr)
            

            console.log("ok : ",rr.ok)
            console.log("status : ",rr.status)
            console.log("statusText : ",rr.statusText)
            console.log("headers : ",rr.headers)
            console.log("url : ",rr.url)
            console.log("redirected : ",rr.redirected)
            console.log("type : ",rr.type)
            console.log("body : ",rr.body)
            console.log("bodyUsed : ",rr.bodyUsed)
            //console.log("text() : ",rr.text())  실제내용 - Promise이어서 return 없이 보기힘듬
            const data = await rr.text()        // return 없이 Promise 처리 await
            console.log("data : ", data)
        })
        .catch(e=>{
            console.log("에러발생")
        })
    </script>
</body>
</html>
